<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Password-gated non-streaming LLM inference workspace.">
  <title>chapatiGPT</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <!-- <link rel="stylesheet" href="/static/styles.css"> -->
</head>
<body class="bg-body-tertiary vh-100 overflow-hidden" hidden>
  <main class="container h-100 py-3 py-md-4">
    <section class="h-100 d-flex flex-column overflow-hidden" aria-label="chapatiGPT workspace">
      <header class="flex-shrink-0 d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 border-bottom pb-2 mb-2">
        <div class="d-flex flex-wrap align-items-center gap-3">
          <h1 class="h4 mb-0">chapatiGPT</h1>
          <nav aria-label="Workspace views">
            <div class="nav nav-tabs border-0" id="workspace-tabs" role="tablist">
              <button class="nav-link active py-1" id="inference-tab" data-bs-toggle="tab" data-bs-target="#inference-panel" type="button" role="tab" aria-controls="inference-panel" aria-selected="true">Inference</button>
              <button class="nav-link py-1" id="alternate-tab" data-bs-toggle="tab" data-bs-target="#alternate-panel" type="button" role="tab" aria-controls="alternate-panel" aria-selected="false">Tab 2</button>
            </div>
          </nav>
        </div>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <div class="form-check mb-0">
            <input id="use-history" class="form-check-input" type="checkbox" checked>
            <label class="form-check-label" for="use-history">Use past responses</label>
          </div>
          <span class="service-status badge text-bg-secondary rounded-pill">Checking service…</span>
          <button id="logout-button" class="btn btn-outline-secondary btn-sm" type="button">Log out</button>
        </div>
      </header>

      <div class="tab-content flex-grow-1 overflow-hidden" id="workspace-tab-content">
      <section id="inference-panel" class="tab-pane fade show active h-100" role="tabpanel" aria-labelledby="inference-tab" tabindex="0" aria-label="Inference search results">
      <div class="h-100 card shadow-sm d-flex flex-column overflow-hidden">
        <div class="card-header bg-body flex-shrink-0 d-flex align-items-center justify-content-between gap-3 py-2">
          <span class="small text-body-secondary">Local results</span>
          <button id="clear-history" class="btn btn-outline-secondary btn-sm" type="button">Clear</button>
        </div>
        <div id="responses" class="card-body flex-grow-1 overflow-auto" aria-live="polite"></div>
        <section class="card-footer bg-body flex-shrink-0" aria-label="Send a prompt">
          <form id="inference-form">
            <label class="visually-hidden" for="prompt">Prompt</label>
            <textarea id="prompt" class="form-control" name="prompt" rows="2" maxlength="20000" placeholder="Search a question or describe an inference task…" aria-label="Prompt. Press Control and Enter to send." required></textarea>
            <p id="inference-error" class="text-danger small mt-2 mb-0" role="alert" hidden></p>
          </form>
        </section>
      </div>
      </section>
      <section id="alternate-panel" class="tab-pane fade h-100" role="tabpanel" aria-labelledby="alternate-tab" tabindex="0" aria-label="Second inference interface">
      <div class="h-100 card shadow-sm d-flex flex-column overflow-hidden">
        <div class="card-header bg-body flex-shrink-0 d-flex align-items-center justify-content-between gap-3 py-2">
          <span class="small text-body-secondary">Local results</span>
          <button id="clear-history-tab-2" class="btn btn-outline-secondary btn-sm" type="button">Clear</button>
        </div>
        <div id="responses-tab-2" class="card-body flex-grow-1 overflow-auto" aria-live="polite"></div>
        <section class="card-footer bg-body flex-shrink-0" aria-label="Send a prompt">
          <form id="inference-form-tab-2">
            <label class="visually-hidden" for="prompt-tab-2">Prompt</label>
            <textarea id="prompt-tab-2" class="form-control" name="prompt" rows="2" maxlength="20000" placeholder="Search a question or describe an inference task…" aria-label="Prompt. Press Control and Enter to send." required></textarea>
            <p id="inference-error-tab-2" class="text-danger small mt-2 mb-0" role="alert" hidden></p>
          </form>
        </section>
      </div>
      </section>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="/static/app.js?v=2" defer></script>
</body>
</html>
