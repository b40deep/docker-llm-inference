<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Password-gated non-streaming LLM inference workspace.">
  <title>Inference Workspace</title>
  <!-- Bootstrap supplies the temporary baseline UI styling. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <!-- Custom project styling is temporarily disabled while using Bootstrap defaults. -->
  <!-- <link rel="stylesheet" href="/static/styles.css"> -->
</head>
<body class="bg-body-tertiary vh-100 overflow-hidden">
  <main class="container h-100 py-3 py-md-4">
    <section id="login-view" class="h-100 d-flex align-items-center justify-content-center" aria-labelledby="login-title">
      <div class="card border-0 shadow-sm w-100" style="max-width: 42rem;">
        <div class="card-body p-4 p-md-5">
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label" for="password">Tekamu password</label>
              <input id="password" class="form-control" name="password" type="password" autocomplete="current-password" autofocus required>
            </div>
            <button class="btn btn-primary" type="submit">Yingila</button>
            <p id="login-error" class="text-danger small mt-3 mb-0" role="alert" hidden></p>
          </form>
          <footer class="small text-body-secondary mt-4">Sign-in and response history are stored only in this browser.</footer>
        </div>
      </div>
    </section>
  </main>
  <script src="/static/login.js" defer></script>
</body>
</html>
