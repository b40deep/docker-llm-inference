<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Password-gated non-streaming LLM inference workspace.">
  <title>Inference Workspace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="container app-shell">
    <section id="login-view" class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">SERVER-SIDE INFERENCE PROXY</p>
      <h1 id="login-title">Focused LLM inference</h1>
      <p class="muted">Enter the shared password to access this workspace. Upstream credentials remain on the server.</p>
      <form id="login-form">
        <label for="password">Shared password
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" role="alert" hidden></p>
      </form>
      <footer>Sign-in and response history are stored only in this browser.</footer>
    </section>

    <section id="workspace-view" hidden aria-label="chapatiGPT workspace">
      <header class="workspace-header">
        <h3>chapatiGPT</h3>
        <div class="header-actions">
          <label class="context-toggle" for="use-history">
            <input id="use-history" type="checkbox" checked>
            Use past responses
          </label>
          <span id="service-status" class="status-pill">Checking service…</span>
          <button id="logout-button" class="secondary outline compact">Log out</button>
        </div>
      </header>

      <section class="search-panel" aria-label="Inference search results">
        <div class="panel-heading">
          <span class="muted">Local results</span>
          <button id="clear-history" class="secondary outline compact">Clear</button>
        </div>
        <div id="responses" class="responses" aria-live="polite"></div>

        <section class="composer-panel" aria-label="Send a prompt">
          <form id="inference-form">
            <textarea id="prompt" name="prompt" rows="2" maxlength="20000" placeholder="Search a question or describe an inference task…" aria-label="Prompt. Press Control and Enter to send." required></textarea>
            <p id="inference-error" class="error" role="alert" hidden></p>
          </form>
        </section>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/lib/marked.umd.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
